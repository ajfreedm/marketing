<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — Scale Your Business</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="assets/css/main.css">
</head>
<body class="bg-[#02457C] text-white font-sans m-0 p-0 min-h-screen flex flex-col">

    <div id="site-header"></div>

    <main class="flex-1">
        <section class="max-w-6xl mx-auto px-6 py-24 md:py-32">
            <h1 class="text-4xl md:text-5xl font-semibold tracking-tight mb-16">Contact Us</h1>
            <div class="grid md:grid-cols-2 gap-16 md:gap-24">
                <div>
                    <p class="text-white/80 leading-relaxed mb-12">
                        I'd love to hear from you. Reach out and I'll respond within one business day.
                    </p>
                    <div class="space-y-8">
                        <div>
                            <p class="text-sm text-white/50 uppercase tracking-widest mb-2">Email</p>
                            <a href="mailto:info@company.com" class="text-white hover:opacity-70 transition-opacity">info@company.com</a>
                        </div>
                        <div>
                            <p class="text-sm text-white/50 uppercase tracking-widest mb-2">Phone</p>
                            <a href="tel:+18005551234" class="text-white hover:opacity-70 transition-opacity">+1 (800) 555-1234</a>
                        </div>
                        <div>
                            <p class="text-sm text-white/50 uppercase tracking-widest mb-2">Address</p>
                            <p class="text-white/80 leading-relaxed">
                                1200 Commerce Boulevard, Suite 400<br>
                                San Francisco, CA 94105
                            </p>
                        </div>
                    </div>
                </div>

                <form id="contact-form" class="space-y-6">
                    <div>
                        <label for="name" class="block text-sm text-white/60 mb-2">Name</label>
                        <input type="text" id="name" name="name" placeholder="Your name" required
                            class="w-full px-4 py-3 text-sm bg-transparent border border-white text-white placeholder-white/70">
                    </div>
                    <div>
                        <label for="email" class="block text-sm text-white/60 mb-2">Email</label>
                        <input type="email" id="email" name="email" placeholder="you@company.com" required
                            class="w-full px-4 py-3 text-sm bg-transparent border border-white text-white placeholder-white/70">
                    </div>
                    <div>
                        <label for="subject" class="block text-sm text-white/60 mb-2">Subject</label>
                        <input type="text" id="subject" name="subject" placeholder="How can we help?"
                            class="w-full px-4 py-3 text-sm bg-transparent border border-white text-white placeholder-white/70">
                    </div>
                    <div>
                        <label for="message" class="block text-sm text-white/60 mb-2">Message</label>
                        <textarea id="message" name="message" rows="5" placeholder="Tell us about your project..." required
                            class="w-full px-4 py-3 text-sm bg-transparent border border-white text-white placeholder-white/70 resize-none"></textarea>
                    </div>
                    <button type="submit"
                        class="border border-white bg-white text-[#02457C] px-8 py-3 text-sm font-medium hover:bg-transparent hover:text-white transition-colors">
                        Send Message
                    </button>
                    <p id="form-success" class="hidden text-sm text-white/80 border border-white/30 px-4 py-3">
                        Thank you! Your message has been sent. We'll be in touch soon.
                    </p>
                </form>
            </div>
        </section>
    </main>

    <div id="site-footer" class="mt-auto w-full"></div>

    <button id="back-to-top" class="back-to-top" aria-label="Back to top">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 19V5M5 12l7-7 7 7"/>
        </svg>
    </button>

    <script src="layouts/load-layout.js"></script>
    <script src="components/chatbot-widget.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
