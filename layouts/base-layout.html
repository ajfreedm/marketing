<!DOCTYPE html>
<!--
  Base layout template — the site is a single scrollable page (index.html).
  Add new sections to index.html with an id attribute for anchor navigation,
  then link to them from components/site-header.html.
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>We Scale Your Business</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="assets/css/main.css">
</head>
<body class="bg-[#02457C] text-white font-sans m-0 p-0 min-h-screen flex flex-col">

    <div id="site-header"></div>

    <main class="flex-1">
        <section id="section-id" class="scroll-mt-24">
            <!-- Section content -->
        </section>
    </main>

    <div id="site-footer" class="mt-auto w-full"></div>

    <script src="layouts/load-layout.js"></script>
    <script src="components/chatbot-widget.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
