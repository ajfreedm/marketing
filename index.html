<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scale Your Business</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="assets/css/main.css">
</head>
<body class="bg-[#02457C] text-white font-sans m-0 p-0 min-h-screen flex flex-col">

    <div id="site-header"></div>

    <main class="flex-1">
        <section class="max-w-6xl mx-auto px-6 py-32 md:py-40">
            <h1 class="text-4xl md:text-6xl font-semibold tracking-tight max-w-3xl leading-tight">
                Scale Your Business for the <span class="accent-highlight">AI future</span>
            </h1>
            <p class="mt-8 text-lg md:text-xl text-white/80 max-w-xl leading-relaxed">
                Payments, automation, performance, security, and visibility — we handle the tech so you can focus on growth.
            </p>
            <div class="mt-12 flex flex-wrap gap-4">
                <a href="services.html" class="border border-white px-8 py-3 text-sm hover:bg-white hover:text-[#02457C] transition-colors">Our Services</a>
                <a href="contact.html" class="border border-white px-8 py-3 text-sm hover:bg-white hover:text-[#02457C] transition-colors">Book a Call</a>
            </div>
        </section>
    </main>

    <div id="site-footer" class="mt-auto w-full"></div>

    <button id="back-to-top" class="back-to-top" aria-label="Back to top">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 19V5M5 12l7-7 7 7"/>
        </svg>
    </button>

    <script src="layouts/load-layout.js"></script>
    <script src="components/chatbot-widget.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
